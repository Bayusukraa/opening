<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SCL SPENMA Champion League</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
    border: none; outline: none;
}
html { width: 100%; height: 100%; overflow: hidden; }
body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000508;
    color: #00c3ff;
    font-family: 'Orbitron', monospace;
    cursor: crosshair;
    position: fixed;
    top: 0; left: 0;
}
body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #000d1a 0%, #000508 100%);
    z-index: 0;
    pointer-events: none;
}

.screen {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1;
}

/* ─── HAND SCREEN ─── */
#hand-screen { transition: opacity .8s ease; }

.command {
    text-align: center;
    margin-bottom: clamp(8px, 1.5vh, 18px);
    z-index: 2;
}
.command h1 {
    font-size: clamp(16px, 3.2vw, 46px);
    letter-spacing: clamp(4px, 1.2vw, 14px);
    color: #00c3ff;
    text-shadow: 0 0 8px #00aaff, 0 0 25px #1e90ff;
    animation: textPulse 3s ease-in-out infinite;
}
.command p {
    margin-top: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(10px, 1.1vw, 13px);
    letter-spacing: clamp(3px, 0.8vw, 8px);
    color: #7df9ff;
    opacity: .65;
    text-transform: uppercase;
}
@keyframes textPulse {
    0%, 100% { text-shadow: 0 0 8px #00aaff, 0 0 20px #00aaff; }
    50%       { text-shadow: 0 0 18px #00aaff, 0 0 50px #1e90ff, 0 0 90px #0055ff; }
}

/* ── HAND WRAPPER — dibesarkan ── */
.hand-wrapper {
    /* lebar lebih besar, hampir penuh layar */
    width: clamp(320px, 78vw, 960px);
    /* tinggi dibatasi agar tidak overflow, sisakan ruang teks */
    max-height: 78vh;
    cursor: pointer;
    animation: handAlive 4s ease-in-out infinite;
    position: relative;
    z-index: 2;
    background: transparent;
}

@media (max-width: 600px) {
    .hand-wrapper {
        width: clamp(280px, 90vw, 420px);
        max-height: 72vh;
    }
    .command h1 { letter-spacing: 4px; }
}
@media (min-width: 1400px) {
    .hand-wrapper { width: clamp(700px, 65vw, 1100px); }
}

/* glow halo */
.hand-wrapper::before {
    content: '';
    position: absolute;
    inset: -8%;
    background: radial-gradient(ellipse at center, rgba(0,160,255,.35) 0%, transparent 68%);
    filter: blur(35px);
    pointer-events: none;
    z-index: 0;
    transition: background .3s;
}
.hand-wrapper:hover::before {
    background: radial-gradient(ellipse at center, rgba(0,210,255,.6) 0%, transparent 65%);
}

.hand {
    width: 100%;
    height: 100%;
    max-height: 78vh;
    object-fit: contain;
    display: block;
    position: relative;
    z-index: 1;
}

@keyframes handAlive {
    0%   { transform: scale(.996) translateY(0); }
    50%  { transform: scale(1.012) translateY(-10px); }
    100% { transform: scale(.996) translateY(0); }
}

.ring-hint {
    position: absolute;
    bottom: -12px; left: 50%;
    transform: translateX(-50%);
    width: clamp(120px, 20vw, 260px);
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,195,255,.3) 0%, transparent 70%);
    animation: ringPulse 4s ease-in-out infinite;
}
@keyframes ringPulse {
    0%, 100% { opacity: .35; transform: translateX(-50%) scaleX(1); }
    50%       { opacity: .85; transform: translateX(-50%) scaleX(1.3); }
}

/* floating particles */
.nodes {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}
.node {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #00c3ff;
    box-shadow: 0 0 6px #00c3ff;
    animation: nodeDrift linear infinite;
    opacity: 0;
}
@keyframes nodeDrift {
    0%   { transform: translateY(0) scale(1);       opacity: 0; }
    10%  { opacity: .7; }
    90%  { opacity: .4; }
    100% { transform: translateY(-120px) scale(.4); opacity: 0; }
}

/* ─── ARENA SCREEN ─── */
#arena-screen {
    display: none;
    background: transparent;
    transition: opacity .8s ease;
    gap: clamp(16px, 3vh, 30px);
}
#arena-screen::before, #arena-screen::after {
    content: '';
    position: absolute;
    left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, #003870, transparent);
    pointer-events: none;
}
#arena-screen::before { top: 33%; }
#arena-screen::after  { bottom: 33%; }

#welcome-text {
    text-align: center;
    font-size: clamp(24px, 6vw, 72px);
    letter-spacing: clamp(4px, 1.5vw, 12px);
    animation: fadeIn .8s ease forwards;
    color: #00c3ff;
    line-height: 1.3;
}
#welcome-text span {
    display: block;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(12px, 2.5vw, 30px);
    margin-top: 12px;
    letter-spacing: clamp(3px, 1vw, 6px);
    color: #7df9ff;
    opacity: .8;
}
.glowPulse { animation: glowPulse 1s ease-in-out infinite; }
@keyframes glowPulse {
    0%   { text-shadow: 0 0 10px #00aaff; }
    50%  { text-shadow: 0 0 30px #00aaff, 0 0 65px #1e90ff, 0 0 110px #0044cc; }
    100% { text-shadow: 0 0 10px #00aaff; }
}

#countdown {
    font-size: clamp(80px, 20vw, 200px);
    font-weight: 900;
    display: none;
    color: #00c3ff;
    text-shadow: 0 0 20px #00aaff, 0 0 60px #1e90ff, 0 0 120px #0044cc;
    letter-spacing: -4px;
    line-height: 1;
}
.countAnim { animation: zoomCount .55s cubic-bezier(.17,.67,.45,1.4); }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes zoomCount {
    0%   { transform: scale(.4); opacity: 0; }
    60%  { transform: scale(1.25); }
    100% { transform: scale(1);   opacity: 1; }
}

/* ─── REVEAL SCREEN ─── */
#reveal-screen {
    display: none;
    background: transparent;
    opacity: 0;
    transition: opacity .6s ease;
    gap: 0;
}
#reveal-screen::before {
    content: '';
    position: absolute;
    left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #00c3ff, transparent);
    box-shadow: 0 0 20px #00c3ff, 0 0 40px #1e90ff;
    animation: scanSweep 1.2s ease forwards;
    pointer-events: none;
}
@keyframes scanSweep {
    0%   { top: -2%; }
    100% { top: 102%; }
}
.reveal-spenma {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(48px, 14vw, 170px);
    letter-spacing: clamp(6px, 2vw, 30px);
    color: transparent;
    background: linear-gradient(135deg, #00c3ff 0%, #7df9ff 40%, #fff 55%, #7df9ff 70%, #00c3ff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    animation: revealSpenma 1.4s cubic-bezier(.16,1,.3,1) forwards, shimmerBg 4s linear infinite;
    opacity: 0;
    transform: scaleX(0.4) translateY(30px);
    filter: blur(12px);
    position: relative;
    line-height: 1.1;
}
@keyframes revealSpenma {
    0%   { opacity: 0; transform: scaleX(.3) translateY(40px); filter: blur(20px); }
    30%  { opacity: .6; filter: blur(6px); }
    65%  { transform: scaleX(1.06) translateY(-6px); filter: blur(1px); }
    80%  { transform: scaleX(.98) translateY(2px); }
    100% { opacity: 1; transform: scaleX(1) translateY(0); filter: blur(0); }
}
@keyframes shimmerBg {
    0%   { background-position: 200% center; }
    100% { background-position: -200% center; }
}
.reveal-spenma::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    color: #00ffff;
    background: none;
    -webkit-background-clip: unset;
    background-clip: unset;
    animation: glitchFlick 2.5s steps(1) infinite;
    opacity: 0;
    clip-path: inset(40% 0 50% 0);
}
@keyframes glitchFlick {
    0%, 90%, 100% { opacity: 0; transform: none; }
    92%  { opacity: .6; transform: translateX(-4px); clip-path: inset(20% 0 60% 0); }
    94%  { opacity: .4; transform: translateX(4px);  clip-path: inset(60% 0 20% 0); }
    96%  { opacity: .7; transform: translateX(-2px); clip-path: inset(10% 0 70% 0); }
}
.reveal-line {
    width: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #00c3ff, #7df9ff, #00c3ff, transparent);
    box-shadow: 0 0 12px #00c3ff, 0 0 30px #1e90ff;
    margin-top: clamp(4px, 1vh, 8px);
    animation: lineGrow 1.2s ease .4s forwards;
}
@keyframes lineGrow {
    from { width: 0; opacity: 0; }
    to   { width: 100%; opacity: 1; }
}
.reveal-sub {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 3.2vw, 44px);
    letter-spacing: clamp(4px, 1.8vw, 24px);
    color: #7df9ff;
    margin-top: clamp(8px, 1.5vh, 20px);
    opacity: 0;
    text-transform: uppercase;
    text-shadow: 0 0 12px #00aaff, 0 0 30px #1e90ff;
    white-space: nowrap;
    min-height: 1.2em;
}

/* ─── VIDEO SCREEN ─── */
#video-screen { display: none; background: #000; }
video { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<!-- HAND SCREEN -->
<div class="screen" id="hand-screen">
    <div class="nodes" id="nodes"></div>
    <div class="command">
        <h1>TOUCH TO ENTER</h1>
        <p>SCL &nbsp;·&nbsp; SPENMA CHAMPION LEAGUE</p>
    </div>
    <div class="hand-wrapper" id="handBtn">
        <img src="fotoo.png" class="hand" alt="hand">
        <div class="ring-hint"></div>
    </div>
</div>

<!-- ARENA SCREEN -->
<div class="screen" id="arena-screen">
    <div id="welcome-text">
        WELCOME
        <span>SPENMA CHAMPION LEAGUE</span>
    </div>
    <div id="countdown"></div>
</div>

<!-- REVEAL SCREEN -->
<div class="screen" id="reveal-screen">
    <div class="reveal-spenma" data-text="SPENMA">SPENMA</div>
    <div class="reveal-line"></div>
    <div class="reveal-sub" id="revealSub"></div>
</div>

<!-- VIDEO SCREEN -->
<div class="screen" id="video-screen">
    <video id="logoVideo" src="" autoplay></video>
</div>

<script>
const AC = new (window.AudioContext || window.webkitAudioContext)();
function unlock() { if (AC.state === 'suspended') AC.resume(); }

function playHover() {
    unlock();
    const osc=AC.createOscillator(), gain=AC.createGain(), t=AC.currentTime;
    osc.connect(gain); gain.connect(AC.destination);
    osc.type='sine';
    osc.frequency.setValueAtTime(380,t); osc.frequency.exponentialRampToValueAtTime(950,t+.2);
    gain.gain.setValueAtTime(.15,t); gain.gain.exponentialRampToValueAtTime(.001,t+.28);
    osc.start(t); osc.stop(t+.3);
}
function playTouch() {
    unlock(); const t=AC.currentTime;
    const sub=AC.createOscillator(), subG=AC.createGain();
    sub.connect(subG); subG.connect(AC.destination);
    sub.type='sine';
    sub.frequency.setValueAtTime(90,t); sub.frequency.exponentialRampToValueAtTime(28,t+.45);
    subG.gain.setValueAtTime(.7,t); subG.gain.exponentialRampToValueAtTime(.001,t+.5);
    sub.start(t); sub.stop(t+.55);
    const whine=AC.createOscillator(), whineG=AC.createGain(), dist=AC.createWaveShaper();
    dist.curve=(()=>{ const c=new Float32Array(256); for(let i=0;i<256;i++) c[i]=(i/128-1)*.5; return c; })();
    whine.connect(dist); dist.connect(whineG); whineG.connect(AC.destination);
    whine.type='sawtooth';
    whine.frequency.setValueAtTime(180,t+.05); whine.frequency.exponentialRampToValueAtTime(2200,t+.7);
    whineG.gain.setValueAtTime(0,t+.05); whineG.gain.linearRampToValueAtTime(.18,t+.25); whineG.gain.exponentialRampToValueAtTime(.001,t+.75);
    whine.start(t+.05); whine.stop(t+.8);
}
function playWelcome() {
    unlock(); const t=AC.currentTime;
    [{f:130.8,d:0},{f:164.8,d:.07},{f:196,d:.14},{f:261.6,d:.2},{f:329.6,d:.28},{f:392,d:.36}].forEach(({f,d})=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.connect(g); g.connect(AC.destination);
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.11,t+d+.4);
        g.gain.setValueAtTime(.11,t+d+1.8); g.gain.exponentialRampToValueAtTime(.001,t+d+3.8);
        o.start(t+d); o.stop(t+d+4);
    });
    const sh=AC.createOscillator(), shG=AC.createGain();
    sh.connect(shG); shG.connect(AC.destination); sh.type='triangle';
    sh.frequency.setValueAtTime(1046,t+.3); sh.frequency.linearRampToValueAtTime(1318,t+1.2);
    shG.gain.setValueAtTime(0,t+.3); shG.gain.linearRampToValueAtTime(.06,t+.7); shG.gain.exponentialRampToValueAtTime(.001,t+3.5);
    sh.start(t+.3); sh.stop(t+3.8);
}
function playBeep() {
    unlock(); const t=AC.currentTime;
    [{f:1200,v:.3,s:0},{f:800,v:.12,s:.13}].forEach(({f,v,s})=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.connect(g); g.connect(AC.destination);
        o.type='square'; o.frequency.value=f;
        g.gain.setValueAtTime(v,t+s); g.gain.exponentialRampToValueAtTime(.001,t+s+.12);
        o.start(t+s); o.stop(t+s+.15);
    });
}
function makeReverb(dur=2.5,dec=3) {
    const len=AC.sampleRate*dur, buf=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
    const conv=AC.createConvolver(); conv.buffer=buf; return conv;
}
function playReveal() {
    unlock(); const t=AC.currentTime, rev=makeReverb(3,2.5);
    rev.connect(AC.destination);
    const sub=AC.createOscillator(), subG=AC.createGain();
    sub.connect(subG); subG.connect(AC.destination); subG.connect(rev);
    sub.type='sine';
    sub.frequency.setValueAtTime(55,t); sub.frequency.exponentialRampToValueAtTime(18,t+.9);
    subG.gain.setValueAtTime(1.2,t); subG.gain.exponentialRampToValueAtTime(.001,t+1);
    sub.start(t); sub.stop(t+1.1);
    const nbuf=AC.createBuffer(1,AC.sampleRate*.15,AC.sampleRate);
    const nd=nbuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const noise=AC.createBufferSource(); noise.buffer=nbuf;
    const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1200; nf.Q.value=0.8;
    const ng=AC.createGain(); noise.connect(nf); nf.connect(ng); ng.connect(AC.destination); ng.connect(rev);
    ng.gain.setValueAtTime(.9,t); ng.gain.exponentialRampToValueAtTime(.001,t+.18);
    noise.start(t); noise.stop(t+.2);
    const wh=AC.createOscillator(), whG=AC.createGain(), whF=AC.createBiquadFilter();
    whF.type='lowpass'; whF.frequency.value=3000;
    wh.connect(whF); whF.connect(whG); whG.connect(AC.destination); whG.connect(rev);
    wh.type='sawtooth';
    wh.frequency.setValueAtTime(60,t+.05); wh.frequency.exponentialRampToValueAtTime(4800,t+.75);
    whG.gain.setValueAtTime(0,t+.05); whG.gain.linearRampToValueAtTime(.35,t+.25); whG.gain.exponentialRampToValueAtTime(.001,t+.8);
    wh.start(t+.05); wh.stop(t+.85);
    [65.4,98,130.8,196,261.6,392].forEach((f,i)=>{
        const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
        lp.type='lowpass'; lp.frequency.value=2000;
        o.connect(lp); lp.connect(g); g.connect(AC.destination); g.connect(rev);
        o.type=i<3?'sawtooth':'triangle'; o.frequency.value=f;
        const d=i*.04;
        g.gain.setValueAtTime(0,t+.1+d); g.gain.linearRampToValueAtTime(.18,t+.4+d);
        g.gain.setValueAtTime(.18,t+1.2+d); g.gain.exponentialRampToValueAtTime(.001,t+5.5+d);
        o.start(t+.1+d); o.stop(t+6);
    });
    [261.6,329.6,392,523.2,659.2,783.9,1046.5].forEach((f,i)=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.connect(g); g.connect(AC.destination); g.connect(rev);
        o.type='sine'; o.frequency.value=f;
        const d=.35+i*.09;
        g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.09,t+d+.08); g.gain.exponentialRampToValueAtTime(.001,t+d+.6);
        o.start(t+d); o.stop(t+d+.7);
    });
    [523.2,659.2,783.9].forEach((f,i)=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.connect(g); g.connect(rev); o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0,t+.8+i*.1); g.gain.linearRampToValueAtTime(.06,t+1.4+i*.1);
        g.gain.setValueAtTime(.06,t+4); g.gain.exponentialRampToValueAtTime(.001,t+6.5);
        o.start(t+.8+i*.1); o.stop(t+7);
    });
}
function playTick() {
    unlock(); const t=AC.currentTime, rev=makeReverb(.4,4);
    rev.connect(AC.destination);
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination); g.connect(rev);
    o.type='square';
    o.frequency.setValueAtTime(2200,t); o.frequency.exponentialRampToValueAtTime(800,t+.04);
    g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
    o.start(t); o.stop(t+.08);
    const s=AC.createOscillator(), sG=AC.createGain();
    s.connect(sG); sG.connect(AC.destination); s.type='sine';
    s.frequency.setValueAtTime(180,t); s.frequency.exponentialRampToValueAtTime(60,t+.05);
    sG.gain.setValueAtTime(.12,t); sG.gain.exponentialRampToValueAtTime(.001,t+.07);
    s.start(t); s.stop(t+.08);
}

// Particles
const nodesEl=document.getElementById("nodes");
for(let i=0;i<32;i++){
    const n=document.createElement("div"); n.className="node";
    n.style.left=(Math.random()*100)+"vw";
    n.style.bottom=(Math.random()*90)+"px";
    n.style.animationDuration=(5+Math.random()*9)+"s";
    n.style.animationDelay=(Math.random()*9)+"s";
    nodesEl.appendChild(n);
}

const handBtn     =document.getElementById("handBtn");
const handScreen  =document.getElementById("hand-screen");
const arenaScreen =document.getElementById("arena-screen");
const welcomeText =document.getElementById("welcome-text");
const countdownEl =document.getElementById("countdown");
const revealScreen=document.getElementById("reveal-screen");
const revealSub   =document.getElementById("revealSub");
const videoScreen =document.getElementById("video-screen");
const video       =document.getElementById("logoVideo");
let started=false, hoverActive=false;

handBtn.addEventListener("mouseenter",()=>{ if(!hoverActive){ playHover(); hoverActive=true; } });
handBtn.addEventListener("mouseleave",()=>{ hoverActive=false; });
handBtn.addEventListener("touchstart",()=>{ unlock(); },{ passive:true });

function showReveal() {
    arenaScreen.style.transition="opacity .4s ease";
    arenaScreen.style.opacity="0";
    setTimeout(()=>{
        arenaScreen.style.display="none";
        revealScreen.style.display="flex";
        revealScreen.style.opacity="0";
        revealScreen.style.transition="opacity .5s ease";
        playReveal();
        const sp=document.querySelector(".reveal-spenma"), ln=document.querySelector(".reveal-line");
        sp.style.animation="none"; ln.style.animation="none";
        void sp.offsetWidth; void ln.offsetWidth;
        sp.style.animation=""; ln.style.animation="";
        setTimeout(()=>{ revealScreen.style.opacity="1"; },30);
        revealSub.innerText=""; revealSub.style.opacity="0";
        setTimeout(()=>{
            revealSub.style.opacity="1";
            const text="CHAMPION LEAGUE"; let idx=0;
            const ti=setInterval(()=>{
                revealSub.innerText+=text[idx]; playTick(); idx++;
                if(idx>=text.length) clearInterval(ti);
            },110);
        },1300);
        setTimeout(()=>{
            revealScreen.style.transition="opacity 1.5s ease";
            revealScreen.style.opacity="0";
            setTimeout(()=>{
                revealScreen.style.display="none";
                videoScreen.style.display="flex";
                video.play();
            },1500);
        },7500);
    },400);
}

function startFlow() {
    if(started) return;
    started=true; unlock();
    playTouch();
    handScreen.style.opacity="0";
    setTimeout(()=>{
        handScreen.style.display="none";
        arenaScreen.style.display="flex";
        playWelcome();
        welcomeText.classList.add("glowPulse");
    },700);
    setTimeout(()=>{
        welcomeText.style.transition="opacity .5s";
        welcomeText.style.opacity="0";
        setTimeout(()=>{
            welcomeText.style.display="none";
            countdownEl.style.display="block";
            let count=3;
            countdownEl.innerText=count;
            countdownEl.classList.add("countAnim");
            playBeep();
            const interval=setInterval(()=>{
                count--;
                if(count>0){
                    countdownEl.innerText=count;
                    countdownEl.classList.remove("countAnim");
                    void countdownEl.offsetWidth;
                    countdownEl.classList.add("countAnim");
                    playBeep();
                    if(count===1){ clearInterval(interval); setTimeout(()=>showReveal(),1800); }
                }
            },1200);
        },500);
    },3500);
}

handBtn.addEventListener("click", startFlow);
handBtn.addEventListener("touchend",(e)=>{ e.preventDefault(); startFlow(); });
</script>
</body>
